name: TACL Reproducibility Verification
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
jobs:
  verify-reproducibility:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install -r requirements.txt || conda env create -f config/environment.yaml
    - name: Verify Raw Data Integrity
      run: python -c "import pandas as pd; df=pd.read_csv('data/final_analysis_dataset.csv');
        assert len(df)==300; assert set(df['Language'].unique())=={'English','Russian','Igbo','Amharic'}"
    - name: Execute Descriptive & Omnibus Statistics
      run: python scripts/python/02_descriptive_statistics.py && python scripts/python/04_kruskal_wallis_omnibus.py
    - name: Execute Post-Hoc Dunn-Holm & Cliff's Delta
      run: python scripts/python/05_dunn_holm_posthoc.py && python scripts/python/06_cliffs_delta_effect_sizes.py
    - name: Generate Publication Figures (JPEG 300 DPI)
      run: python scripts/python/07_generate_figure1_tcr.py && python scripts/python/08_generate_figure2_tmr.py
        && python scripts/python/09_generate_figure3_tci.py && python scripts/python/10_generate_figure4_joint_profile.py
    - name: Audit Processed Data Integrity
      run: python -c "import os; assert os.path.exists('processed_data/01_cleaned_item_level_data.csv')"
